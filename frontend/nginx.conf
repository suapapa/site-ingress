server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우트는 Go 백엔드가 서버 렌더링해서 내려줍니다 (main.go / render.go).
    # 이유: 이 앱은 WebGL 클라이언트 렌더링이라 JS 를 실행하지 않는 크롤러
    # (특히 네이버 Yeti) 에게는 <div id="app"></div> 빈 문서로 보입니다.
    # 백엔드는 API 와 동일한 설정으로 링크 목록을 렌더해 그 안에 넣어 줍니다.
    #
    # prefix 를 추가하면: @backend 로도 흘러가므로 프록시 없이도 동작하지만,
    # 백엔드 장애 시 정적 shell 폴백을 받으려면 여기 정규식에 추가하세요.
    location ~ ^/(social|archive|support)?/?$ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 백엔드가 죽어도 페이지는 살아 있어야 합니다 → 정적 shell 로 폴백하면
        # 예전처럼 클라이언트 렌더링이 그대로 동작합니다.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @shell;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 해시가 포함된 Vite 정적 번들 자산은 Nginx에서 직접 장기 캐시로 서빙
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 정적 자산(model/, og.png …)과 백엔드가 처리하는 나머지 경로
    # (robots.txt, sitemap.xml, llms.txt, *.md, 단축 링크).
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 장애 시 폴백: 프리렌더 없는 순수 클라이언트 렌더링 shell.
    location @shell {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
