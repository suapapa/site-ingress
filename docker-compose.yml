services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:80"
    environment:
      - GIN_MODE=release
    volumes:
      - ./conf/links.yaml:/app/conf/links.yaml:ro
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: "service:backend"
    restart: always
    depends_on:
      - backend
